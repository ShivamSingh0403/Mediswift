<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mediswift - Doctor Consultation</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Simple styling for the tabs system */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .tab-btn {
            background-color: #f0f2f5;
            color: #333;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tab-btn:hover {
            background-color: #e0e4e8;
        }

        .tab-btn.active {
            background-color: #007bff;
            color: white;
            box-shadow: 0 4px 10px rgba(0, 123, 255, 0.3);
        }

        .doctor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .doctor-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
            text-align: center;
            border: 1px solid #eee;
        }

        .doctor-card h3 {
            margin: 10px 0 5px 0;
            color: #333;
        }

        .doctor-card p {
            margin: 5px 0;
            color: #666;
        }

        .doctor-card .specialty {
            color: #007bff;
            font-weight: bold;
            font-size: 14px;
        }

        .doctor-card .fees {
            font-weight: bold;
            color: #28a745;
            margin: 10px 0;
        }

        .video-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: background 0.2s;
        }

        .video-btn:hover {
            background-color: #0056b3;
        }

        .no-doctors {
            text-align: center;
            grid-column: 1 / -1;
            color: #888;
            font-size: 18px;
            padding: 40px;
        }
    </style>
</head>

<body>

    <header
        style="text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #007bff, #0056b3); color: white;">
        <h1>Live Video Consultation</h1>
        <p>Select a specialty to find available doctors</p>
    </header>

    <div id="doctorListSection">
        <div class="tabs-container">
            <button class="tab-btn active" onclick="filterCategory('All', this)">All Doctors</button>
            <button class="tab-btn" onclick="filterCategory('General Physician', this)">General Physician</button>
            <button class="tab-btn" onclick="filterCategory('Cardiologist', this)">Cardiologist</button>
            <button class="tab-btn" onclick="filterCategory('Dermatologist', this)">Dermatologist</button>
            <button class="tab-btn" onclick="filterCategory('Pediatrician', this)">Pediatrician</button>
        </div>

        <div class="doctor-grid" id="doctorGrid"></div>
    </div>


    <div id="consultationRoom"
        style="display: none; max-width: 1200px; margin: 40px auto; padding: 0 20px; flex-wrap: wrap; gap: 30px; align-items: flex-start;">

        <div
            style="flex: 1; min-width: 350px; background: #f8fafc; padding: 30px; border-radius: 16px; border: 1px solid #e2e8f0;">
            <button onclick="leaveRoom()"
                style="margin-bottom: 20px; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer;">⬅
                Leave Room</button>

            <span
                style="color: #007bff; font-weight: bold; font-size: 12px; text-transform: uppercase; letter-spacing: 1px;">Secure
                Connection</span>
            <h2 id="roomDoctorName" style="margin: 10px 0; color: #333;">Consultation with Doctor</h2>
            <p style="color: #666; margin-bottom: 20px;">Review your symptoms and share any previous prescriptions with
                the doctor during the call.</p>

            <div style="background: white; padding: 20px; border-radius: 8px; border: 1px solid #cbd5e1;">
                <strong>Patient Notes:</strong>
                <textarea rows="5"
                    style="width: 100%; margin-top: 8px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; resize: vertical;"
                    placeholder="Type your symptoms here before the doctor arrives..."></textarea>
            </div>
        </div>

        <aside
            style="width: 350px; background: white; padding: 25px; border-radius: 16px; border: 1px solid #e2e8f0; box-shadow: 0 10px 30px rgba(0,0,0,0.05); flex-shrink: 0;">
            <div style="text-align: center; margin-bottom: 20px;">
                <span style="font-weight: 700; color: #333;">🔴 Live Video Room</span>
            </div>

            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div style="position: relative;">
                    <span
                        style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; z-index: 10;">Doctor</span>
                    <video id="doctorVideo" autoplay playsinline
                        style="width: 100%; background: #0f172a; border-radius: 12px; aspect-ratio: 4/3; object-fit: cover;"></video>
                </div>

                <div style="position: relative;">
                    <span
                        style="position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.6); color: white; padding: 4px 10px; border-radius: 20px; font-size: 12px; z-index: 10;">You</span>
                    <video id="myVideo" autoplay muted playsinline
                        style="width: 100%; background: #1e293b; border-radius: 12px; aspect-ratio: 4/3; object-fit: cover;"></video>
                </div>
            </div>
            <div style="display: flex; gap: 20px;">
                <video id="doctorLocalVideo" autoplay muted
                    style="width: 300px; border: 2px solid #0fbe8a; border-radius: 12px;"></video>
                <video id="patientRemoteVideo" autoplay
                    style="width: 500px; border: 2px solid white; border-radius: 12px;"></video>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="button" id="toggleCamBtn" onclick="toggleCamera()"
                    style="flex: 1; background: #28a745; color: white; border: none; padding: 12px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s;">
                    📹 Camera
                </button>
                <div id="audioStatus" style="text-align: center; font-size: 13px; color: #64748b; margin-top: 5px;">
                    🎤 Mic Status: Standing by...
                </div>
                <button type="button" id="toggleMicBtn" onclick="toggleMute()"
                    style="flex: 1; background: #28a745; color: white; border: none; padding: 12px 10px; border-radius: 8px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s;">
                    🎤 Mute
                </button>
            </div>

            <button type="button" onclick="endCall()"
                style="margin-top: 15px; width: 100%; background: #ef4444; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer;">
                📞 End Call
            </button>

        </aside>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="consultation.js"></script>
</body>

</html>
