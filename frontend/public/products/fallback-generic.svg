<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EFF6FF" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#0F766E" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bgGrad)" />

  <!-- Center Card -->
  <rect x="160" y="160" width="480" height="480" rx="40" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="4" />

  <!-- Medical Cross Glow -->
  <circle cx="400" cy="360" r="110" fill="#CCFBF1" opacity="0.6" />

  <!-- Medical Cross -->
  <rect x="382" y="270" width="36" height="180" rx="14" fill="url(#crossGrad)" />
  <rect x="310" y="342" width="180" height="36" rx="14" fill="url(#crossGrad)" />

  <!-- Text -->
  <text x="400" y="500" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="28" font-weight="700" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">HEALTHCARE PRODUCT</text>
  <text x="400" y="540" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="16" font-weight="600" fill="#64748B" text-anchor="middle" letter-spacing="1">MEDISWIFT VERIFIED CATALOG</text>
</svg>
