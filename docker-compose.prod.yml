version: '3.8'

services:
  # 1. PostgreSQL Production Database
  db:
    image: postgres:16-alpine
    container_name: mediswift_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-mediswift_db}
      POSTGRES_USER: ${DB_USER:-mediswift_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediswift_secure_password_2026}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-mediswift_user} -d ${DB_NAME:-mediswift_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mediswift_prod_net

  # 2. Django Gunicorn Web Application
  web:
    build:
      context: ./mediswift_backend
      dockerfile: Dockerfile
    container_name: mediswift_prod_web
    restart: always
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 --threads 2 --timeout 120 mediswift_backend.wsgi:application
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      - DATABASE_URL=postgres://${DB_USER:-mediswift_user}:${DB_PASSWORD:-mediswift_secure_password_2026}@db:5432/${DB_NAME:-mediswift_db}
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-mediswift_db}
      - DB_USER=${DB_USER:-mediswift_user}
      - DB_PASSWORD=${DB_PASSWORD:-mediswift_secure_password_2026}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mediswift_prod_net

  # 3. Nginx Reverse Proxy
  nginx:
    image: nginx:1.25-alpine
    container_name: mediswift_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - web
    networks:
      - mediswift_prod_net

volumes:
  postgres_prod_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  mediswift_prod_net:
    driver: bridge
